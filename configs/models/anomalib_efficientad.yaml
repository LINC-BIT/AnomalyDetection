# EfficientAD requires a natural-image regularization directory in addition
# to the ZJU normal/defect data. On this machine data/imagenette points to the
# Imagenette train/val tree on the external SSD. A cloud host must stage the
# same dataset or override `train.model_kwargs.imagenet_dir`.

model:
  name: EfficientAD

data:
  dataset: zju-leaper
  dataset_root: ${ZJU_LEAPER_ROOT}
  train_selection:
    split: train
    pattern: [pattern1, pattern2, pattern3, pattern4]
    num_samples: 1200
    use_defect: false
    task: anomaly
    seed: 0
  test_selection:
    split: test
    pattern: [pattern1, pattern2, pattern3, pattern4]
    num_samples: 400
    use_defect: true
    defect_ratio: 0.5
    task: anomaly
    seed: 0

train:
  enabled: true
  model_kwargs:
    imagenet_dir: datasets/general/imagenette
    model_size: small
  engine_kwargs:
    max_epochs: 10
  num_workers: 0

val:
  enabled: true
  output_dir: artifacts/anomaly_maps/efficientad_zju_pattern1-4
  max_pixels: 1000000
  max_aupro_images: 50
  seed: 0

predict:
  output_dir: null

export:
  enabled: false
  formats: [torch]

checkpoint:
  default_root_dir: runs/efficientad_zju_pattern1-4
  name: efficientad_zju_pattern1-4
  registry_dir: textile/artifacts/models
